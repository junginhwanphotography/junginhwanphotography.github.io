    <script>
      // 컬렉션 메뉴 로드 (WALL, COLLECTION#1, COLLECTION#2)
      async function loadSidebar() {
        const nav = document.getElementById("collection-nav");
        if (!nav) return;

        let currentId = "index";
        if (window.location.pathname.includes("collection.html")) {
          currentId = new URLSearchParams(window.location.search).get("collection") || "";
        }

        try {
          const res = await fetch("collections.json", { cache: "no-store" });
          if (!res.ok) return;
          const collections = await res.json();
          if (!Array.isArray(collections)) return;

          function displayName(id) {
            return id && id.startsWith("_") ? id.slice(1) : (id || "");
          }
          function isHiddenCollection(id) {
            const n = (id || "").replace(/^_/, "").toUpperCase();
            return n === "WALL";
          }
          collections.forEach((collection, index) => {
            if (isHiddenCollection(collection.id)) return;
            const link = document.createElement("a");
            link.href = "collection.html?collection=" + encodeURIComponent(collection.id);
            link.textContent = displayName(collection.id);
            link.className = "sidebar-link";
            if (collection.id === currentId) link.classList.add("active");
            // _ 로 시작하는 컬렉션은 맨 위에 표시하고 아래 간격 추가
            if (collection.id.startsWith("_")) {
              link.classList.add("wall-link");
            }
            nav.appendChild(link);
          });
          fitNavLinks();
        } catch (e) {}
      }

      function fitNavLinks() {
        const nav = document.getElementById("collection-nav");
        if (!nav) return;
        const vw =
          (window.visualViewport && window.visualViewport.width) ||
          document.documentElement.clientWidth ||
          window.innerWidth;
        const styles = getComputedStyle(nav);
        const pad =
          (parseFloat(styles.paddingLeft) || 0) + (parseFloat(styles.paddingRight) || 0);
        const avail = Math.max(80, vw - pad);
        nav.querySelectorAll("a").forEach((link) => {
          link.style.transform = "none";
          link.style.whiteSpace = "nowrap";
          const need = link.scrollWidth;
          if (need > avail && need > 0) {
            link.style.transformOrigin = "left center";
            link.style.transform = `scale(${avail / need})`;
          }
        });
      }

      window.addEventListener("resize", fitNavLinks);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", fitNavLinks);
      }
      loadSidebar().then(() => {
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(fitNavLinks);
        }
      });

      (function startDvdBounce() {
        const el = document.getElementById("dvd-bounce");
        if (!el) return;

        const colors = ["#111111", "#c43c3c", "#2f6fed", "#1a9b6c", "#d4a017", "#8a4baf"];
        const desktopSpeed = 2.3;
        const mobileSpeed = 1.1;
        let colorIndex = 0;
        let x = 0;
        let y = 0;
        let vx = desktopSpeed;
        let vy = desktopSpeed;
        let width = 0;
        let height = 0;
        let last = 0;

        function currentSpeed() {
          return window.matchMedia("(max-width: 640px)").matches ? mobileSpeed : desktopSpeed;
        }

        function applySpeed() {
          const s = currentSpeed();
          vx = (vx < 0 ? -1 : 1) * s;
          vy = (vy < 0 ? -1 : 1) * s;
        }

        function measure() {
          const box = el.getBoundingClientRect();
          width = box.width;
          height = box.height;
          const maxX = Math.max(0, window.innerWidth - width);
          const maxY = Math.max(0, window.innerHeight - height);
          x = Math.min(Math.max(0, x), maxX);
          y = Math.min(Math.max(0, y), maxY);
        }

        function nextColor() {
          colorIndex = (colorIndex + 1) % colors.length;
          el.style.color = colors[colorIndex];
        }

        function frame(now) {
          if (!last) last = now;
          const dt = Math.min(32, now - last) / 16.67;
          last = now;
          const maxX = Math.max(0, window.innerWidth - width);
          const maxY = Math.max(0, window.innerHeight - height);
          x += vx * dt;
          y += vy * dt;
          let bounced = false;
          if (x <= 0) {
            x = 0;
            vx = Math.abs(vx);
            bounced = true;
          } else if (x >= maxX) {
            x = maxX;
            vx = -Math.abs(vx);
            bounced = true;
          }
          if (y <= 0) {
            y = 0;
            vy = Math.abs(vy);
            bounced = true;
          } else if (y >= maxY) {
            y = maxY;
            vy = -Math.abs(vy);
            bounced = true;
          }
          if (bounced) nextColor();
          el.style.transform = "translate(" + x + "px," + y + "px)";
          requestAnimationFrame(frame);
        }

        function start() {
          measure();
          const maxX = Math.max(0, window.innerWidth - width);
          const maxY = Math.max(0, window.innerHeight - height);
          x = Math.random() * maxX;
          y = Math.random() * maxY;
          const s = currentSpeed();
          vx = s * (Math.random() < 0.5 ? 1 : -1);
          vy = s * (Math.random() < 0.5 ? 1 : -1);
          el.style.transform = "translate(" + x + "px," + y + "px)";
          requestAnimationFrame(frame);
        }

        window.addEventListener("resize", () => {
          measure();
          applySpeed();
        });
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(start);
        } else {
          start();
        }
      })();
